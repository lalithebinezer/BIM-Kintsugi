<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BIM Kintsugi Help Center — Step-by-Step User Guides</title>
  <meta name="description" content="Official step-by-step Help Center for BIM Kintsugi 3D/4D/5D/6D OpenBIM Digital Twin Platform." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('bim_theme_preset') || localStorage.getItem('bim_theme') || 'obsidian';
        document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'light-studio') ? 'light' : 'obsidian');
      } catch (e) {}
    })();
  </script>
  <style>
    :root, [data-theme="obsidian"] {
      --bg: #0a0b10;
      --surface: #12151f;
      --surface-2: #181c29;
      --surface-hover: #1f2536;
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #d4ff3f;
      --accent-text: #d4ff3f;
      --accent-ink: #0a0b10;
      --accent-soft: rgba(212, 255, 63, 0.13);
      --accent-border: rgba(212, 255, 63, 0.42);
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.42);
      color-scheme: dark;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --surface-hover: #e2e8f0;
      --border: rgba(15, 23, 42, 0.1);
      --border-strong: rgba(15, 23, 42, 0.18);
      --text: #0f172a;
      --muted: #475569;
      --accent: #4f46e5;
      --accent-text: #4338ca;
      --accent-ink: #ffffff;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --accent-border: rgba(79, 70, 229, 0.4);
      --shadow: 0 14px 36px rgba(15, 23, 42, 0.1);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    code {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.86em;
      padding: 0.12rem 0.36rem;
      border-radius: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      padding: 0.1rem 0.4rem;
      border-radius: 5px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.78em;
      font-weight: 700;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 62px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.01em;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent-soft);
      border: 1.5px solid var(--accent-border);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
    }
    .topbar-search {
      flex: 1 1 360px;
      max-width: 440px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .topbar-search svg {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }
    .topbar-search input {
      width: 100%;
      height: 38px;
      padding: 0 12px 0 36px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    .topbar-search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 13px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.14s ease, border-color 0.14s ease;
    }
    .btn:hover { background: var(--surface-hover); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    .btn-primary:hover { filter: brightness(1.06); background: var(--accent); }
    .btn-menu-mob { display: none; width: 38px; padding: 0; }

    .layout {
      max-width: 1360px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 278px minmax(0, 1fr) 220px;
      gap: 28px;
      padding: 24px 20px 64px;
      align-items: start;
    }
    .sidebar {
      position: sticky;
      top: 84px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      max-height: calc(100vh - 104px);
      overflow-y: auto;
    }
    .nav-group { margin-bottom: 14px; }
    .nav-group:last-child { margin-bottom: 0; }
    .nav-group-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 4px 10px 6px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 650;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 2px;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .nav-link:hover { background: var(--surface-2); }
    .nav-link.is-active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }
    .nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .main { min-width: 0; }
    .hero-card {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .hero-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: var(--accent-text);
      margin-bottom: 8px;
    }
    .hero-card h1 { margin: 0 0 10px; font-size: clamp(24px, 3vw, 32px); line-height: 1.2; font-weight: 800; }
    .hero-card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 68ch; }
    .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .guide-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }
    .guide-card:hover { transform: translateY(-2px); border-color: var(--accent-border); background: var(--surface-2); }
    .guide-card__top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--item-accent, var(--accent)) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--item-accent, var(--accent)) 30%, transparent);
      flex-shrink: 0;
    }
    .cat-pill {
      font-size: 11px;
      font-weight: 750;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 9999px;
    }
    .guide-card h3 { margin: 0; font-size: 15.5px; font-weight: 800; line-height: 1.3; }
    .guide-card p { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
    .guide-card__foot {
      margin-top: auto;
      padding-top: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 750;
      color: var(--accent-text);
    }
    .article-shell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 30px;
      box-shadow: var(--shadow);
    }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 16px; }
    .breadcrumbs button { border: none; background: none; padding: 0; color: var(--accent-text); font: inherit; font-weight: 750; cursor: pointer; }
    .article-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .article-head h1 { margin: 4px 0 8px; font-size: clamp(22px, 2.6vw, 28px); line-height: 1.25; }
    .article-head p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
    .prereq {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 22px;
    }
    .prereq-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent-text); margin-bottom: 6px; }
    .prereq ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    .step-list { display: flex; flex-direction: column; gap: 14px; }
    .step-card {
      display: flex;
      gap: 14px;
      padding: 16px 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      break-inside: avoid;
    }
    .step-num {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent-text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-card h2 { margin: 0 0 6px; font-size: 15.5px; font-weight: 800; }
    .step-card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--text); opacity: 0.92; }
    .step-tip { margin-top: 10px; padding: 9px 12px; border-radius: 9px; background: var(--accent-soft); border: 1px solid var(--accent-border); font-size: 13px; line-height: 1.5; }
    .callout { margin-top: 18px; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-border); break-inside: avoid; }
    .callout-title { font-size: 13px; font-weight: 800; color: var(--accent-text); margin-bottom: 4px; }
    .callout-body { font-size: 13.5px; line-height: 1.55; }
    .faq-wrap { margin-top: 24px; }
    .faq-wrap h3 { margin: 0 0 10px; font-size: 15px; font-weight: 800; }
    details.faq { background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; margin-bottom: 8px; break-inside: avoid; }
    details.faq summary { cursor: pointer; font-weight: 750; font-size: 14px; }
    details.faq p { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }
    .pager { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .pager-btn { display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); text-align: left; cursor: pointer; font-family: inherit; }
    .pager-btn:hover { border-color: var(--accent-border); background: var(--surface-hover); }
    .pager-btn--next { text-align: right; }
    .pager-dir { font-size: 11.5px; font-weight: 800; color: var(--accent-text); }
    .pager-title { font-size: 13.5px; font-weight: 750; }
    .toc { position: sticky; top: 84px; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
    .toc-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
    .toc a { display: block; padding: 5px 8px; border-radius: 7px; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
    .toc a:hover { color: var(--text); background: var(--surface-2); }

    @media (max-width: 1100px) {
      .layout { grid-template-columns: 248px minmax(0, 1fr); }
      .toc { display: none; }
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; padding: 16px 14px 48px; }
      .btn-menu-mob { display: inline-flex; }
      .sidebar { display: none; position: fixed; top: 68px; left: 12px; right: 12px; z-index: 60; max-height: 75vh; box-shadow: var(--shadow); }
      .sidebar.is-open { display: block; }
      .card-grid, .pager { grid-template-columns: 1fr; }
      .article-shell { padding: 18px 16px; }
      .brand-sub { display: none; }
    }

    /* Clean Vector Print / PDF Export for Individual SOP Guides */
    @media print {
      :root, [data-theme] {
        --bg: #ffffff !important;
        --surface: #ffffff !important;
        --surface-2: #f8fafc !important;
        --border: #cbd5e1 !important;
        --border-strong: #94a3b8 !important;
        --text: #0f172a !important;
        --muted: #334155 !important;
        --accent: #312e81 !important;
        --accent-text: #312e81 !important;
        --accent-soft: #eef2ff !important;
        --accent-border: #818cf8 !important;
        color-scheme: light !important;
      }
      .topbar, .sidebar, .toc, .no-print, .breadcrumbs { display: none !important; }
      .layout { display: block !important; padding: 0 !important; max-width: 100% !important; }
      .article-shell { border: none !important; box-shadow: none !important; padding: 0 !important; }
      .step-card, .prereq, .callout, details.faq { border: 1px solid #cbd5e1 !important; }
      body { background: #ffffff !important; color: #0f172a !important; }
    }
  </style>
  <script type="module" crossorigin src="./assets/help-B7LAVmBh.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="./assets/helpCenterArticles-CWJAGNzn.js">
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" class="btn btn-menu-mob" id="btn-mob-nav" aria-label="Toggle Guides Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
      <a href="#home" class="brand" id="brand-home" data-nav="home">
        <span class="brand-mark">K</span>
        <span>BIM Kintsugi</span>
        <span class="brand-sub">Help Center</span>
      </a>
    </div>
    <div class="topbar-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="help-search" placeholder="Search guides (Cockpit, 4D, CasCADe, BCF, Photo, GAEB)..." aria-label="Search Help Center" />
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn" id="btn-print-guide" title="Print or Save Guide as PDF">Print / PDF</button>
      <button type="button" class="btn" id="btn-theme" title="Toggle Light / Dark Theme">Theme</button>
      <a class="btn btn-primary" href="./">&larr; Back to 3D App</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="help-sidebar" aria-label="Help Center Navigation"></aside>
    <main class="main" id="help-main"></main>
    <aside class="toc" id="help-toc" aria-label="On This Page"></aside>
  </div>

</body>
</html>
